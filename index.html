<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#FFF4E8" />
    <meta name="description" content="Strike a pose, keep the strip. A free photobooth in your browser with cute templates and face effects. No sign-up, and your photos stay on your device." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oh, Snap!" />
    <meta property="og:title" content="Oh, Snap! — a photobooth in your browser" />
    <meta property="og:description" content="Strike a pose, keep the strip. Free, no sign-up, and your photos stay on your device." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Oh, Snap! by Jomer — three cute photo strips on a pink polka-dot background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oh, Snap! — a photobooth in your browser" />

    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <title>Oh, Snap! — a photobooth in your browser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
